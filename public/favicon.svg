  <path d="M 36 78 Q 50 82 64 78" stroke="#EF4444" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="50" cy="81" r="2.8" fill="#FBBF24" stroke="#D97706" stroke-width="0.8" />
