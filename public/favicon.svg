<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="duo_blue_body" x1="50" y1="10" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" />
      <stop offset="1" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="duo_ear_l" x1="16" y1="20" x2="28" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8" />
      <stop offset="0.75" stop-color="#1E40AF" />
      <stop offset="0.76" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="duo_ear_r" x1="84" y1="20" x2="72" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8" />
      <stop offset="0.75" stop-color="#1E40AF" />
      <stop offset="0.76" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="50" cy="94" rx="30" ry="4" fill="#CBD5E1" opacity="0.6" />

  <!-- Beagle Hound Ears -->
  <path d="M 28 22 C 14 26 8 44 10 65 C 11 74 18 78 24 74 C 30 70 32 50 30 32 Z" fill="url(#duo_ear_l)" />
  <path d="M 72 22 C 86 26 92 44 90 65 C 89 74 82 78 76 74 C 70 70 68 50 70 32 Z" fill="url(#duo_ear_r)" />

